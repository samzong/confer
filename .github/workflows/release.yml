name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify SemVer tag and Cargo manifest
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" != refs/tags/* ]]; then
            echo "::error::Release workflow must run from a tag ref, got: ${GITHUB_REF:-missing}"
            exit 1
          fi
          tag="${GITHUB_REF_NAME:-}"
          regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\.[1-9][0-9]*))?$'
          if [[ ! "$tag" =~ $regex ]]; then
            echo "::error::Invalid SemVer release tag: $tag"
            exit 1
          fi
          version="${tag#v}"
          manifest_version="$(python3 -c 'import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          pkg = data.get("package", {})
          ver = pkg.get("version")
          if not isinstance(ver, str):
              ver = data.get("workspace", {}).get("package", {}).get("version", "")
          print(ver if isinstance(ver, str) else "")')"
          if [[ -z "$manifest_version" || "$manifest_version" != "$version" ]]; then
            echo "::error::Tag version $version does not match Cargo.toml version ${manifest_version:-missing}"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$tag^{commit}")" ]]; then
            echo "::error::Checked out commit does not match tag $tag"
            exit 1
          fi
          is_prerelease="false"
          make_latest="true"
          if [[ "$tag" =~ -(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            is_prerelease="true"
            make_latest="false"
          fi
          {
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: make check

  build:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          archive="confer-${GITHUB_REF_NAME}-${os}-${arch}.tar.gz"
          tar -czf "$archive" -C target/release confer -C ../.. README.md LICENSE
          echo "archive=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.os }}
          path: ${{ env.archive }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true
      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v needle="## [$version](" '
            index($0, needle) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md entry for $version" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: release-notes.md
          files: confer-*.tar.gz
          prerelease: ${{ needs.check.outputs.is_prerelease }}
          make_latest: ${{ needs.check.outputs.make_latest }}
